# ===============================================================
# Render Blueprint — ghrub
# ===============================================================
# Multi-service blueprint, one web service per branch, Docker runtime, deploys
# driven by the GitHub Actions `render-deploy-action` using your RENDER_API_KEY
# (autoDeploy off so CI gates the deploy).
#
# Storage is Neon Postgres, not a Render disk. That is what lets these services
# run on the free plan: a persistent disk requires a paid instance type, while
# Neon holds the data outside Render entirely, so a free instance spinning down
# or being replaced costs nothing. It also means the two services can share or
# split data by pointing at different Neon branches.
#
# REGION: keep this matched to your Neon region (us-east-2 = Ohio). The app
# makes several queries per page render, so putting the web service on another
# continent adds that round trip to every one of them.
#
# One-time setup: Render Dashboard -> New -> Blueprint -> pick the ghrub repo ->
# it reads this file and creates both services. Then set DATABASE_URL on each
# service (it is sync: false, so Render prompts for it and never stores it in
# git). Copy each service's ID (srv-...) into GitHub secrets (see
# docs/04-devops-cicd.md).

services:
  # ---- Production (main branch) ----
  - type: web
    name: ghrub
    env: docker
    region: ohio # matches the Neon project's us-east-2 — see REGION note above
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: false # GitHub Actions triggers the deploy after CI passes
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string — set in the Render dashboard
      - key: ENABLE_LLM
        value: "false"
      - key: GHRUB_PASSPHRASE
        sync: false # set in the Render dashboard if you want a simple gate
      - key: ANTHROPIC_API_KEY
        sync: false # only needed when ENABLE_LLM=true (M5)

  # ---- Staging (staging branch) ----
  # Point this at a *separate* Neon branch, or staging deploys will write over
  # the real grocery history. Neon branches are copy-on-write and free to make:
  # Neon Console -> Branches -> New branch from production.
  - type: web
    name: ghrub-staging
    env: docker
    region: ohio
    plan: free
    branch: staging
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # a Neon *staging branch* connection string
      - key: ENABLE_LLM
        value: "false"
      - key: GHRUB_PASSPHRASE
        sync: false

# --- Notes on the free plan ---
# Free web services sleep after ~15 minutes idle and take a few seconds to wake
# on the next request. The data is unaffected — it lives in Neon. If the wake
# delay becomes annoying, `plan: starter` removes it without any other change,
# because nothing here depends on local disk any more.

name: deploy-staging

# Deploys the `staging` branch to the ghrub-staging Render service after CI.
# Uses your existing RENDER_API_KEY + the staging service id (same pattern as
# Underground Terminal's render-deploy-action step).
#
# workflow_dispatch is here so the deploy can be retried from the Actions tab
# once the Render secrets land — without needing an empty commit to re-trigger.

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Guard — secrets present
        env:
          KEY: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SID" ]; then
            echo "::error::Render deploy is not configured — this branch built and tested fine, but nothing was deployed."
            {
              echo "### Deploy skipped — Render not wired up yet"
              echo ""
              echo "CI passed; the deploy step needs two secrets. From a shell with your Render key:"
              echo ""
              echo '```bash'
              echo 'gh secret set RENDER_API_KEY --body "$RENDER_API_KEY"'
              echo 'gh secret set RENDER_SERVICE_ID_STAGING --body "srv-xxxxxxxx"'
              echo '```'
              echo ""
              echo "Then re-run this workflow from the Actions tab (workflow_dispatch)."
              echo "See docs/04-devops-cicd.md § One-time setup."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Pinned to the v0.0.8 commit SHA: a moved tag on a third-party action
      # would otherwise run unreviewed code with our Render API key.
      - name: Deploy to Render (staging)
        uses: johnbeynon/render-deploy-action@a0588f9aca995a15d69a72cb2bfbf37c12e5b540 # v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

      # "Deploy succeeded" is Render's word for it. Confirm the service actually
      # serves traffic before calling the promotion done.
      - name: Verify deployed /healthz
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "${{ vars.STAGING_URL }}/healthz" | grep -q '"ok":true'; then
              echo "staging /healthz is live"; exit 0
            fi
            sleep 5
          done
          echo "::error::${{ vars.STAGING_URL }}/healthz did not return ok:true after deploy"
          exit 1

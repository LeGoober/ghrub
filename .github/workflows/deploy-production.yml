name: deploy-production

# Deploys the `main` branch to the ghrub Render service after CI.
# Uses your existing RENDER_API_KEY + the production service id.

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Guard — secrets present
        env:
          KEY: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SID" ]; then
            echo "::error::Set RENDER_API_KEY and RENDER_SERVICE_ID_PRODUCTION in repo Settings > Secrets."
            exit 1
          fi
      - name: Deploy to Render (production)
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

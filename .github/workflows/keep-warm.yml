name: keep-warm

# Render's free plan puts the service to sleep after 15 idle minutes, and the
# next open of the home-screen app waits ~30-50s while it wakes (docs/07 F11).
# A ping every 10 minutes through the waking day keeps it up when you are
# likely to shop. Overnight it is allowed to sleep, which keeps one service well
# inside Render's 750 free hours a month. The repo is public, so these runs
# cost no Actions minutes.
#
# GitHub may delay or skip a scheduled run under load, and pauses schedules on
# a repo with no activity for 60 days. The service worker's "waking up" screen
# covers both cases.

on:
  schedule:
    # Every 10 minutes from 05:00 to 21:50 SAST (03:00-19:50 UTC).
    - cron: '*/10 3-19 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://ghrub.onrender.com/healthz

name: ci

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]
  workflow_call: {} # invoked by deploy-staging / deploy-production before they deploy

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    # The unit tests need no server — they run against PGlite in-process. This
    # is here for the seed idempotency check below, which has to prove that a
    # SECOND process importing into an EXISTING database changes nothing, and
    # so needs storage that outlives one node invocation.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test
        run: npm test

      # Idempotency is a hard rule (docs/05-agent-runbook.md) but CI only ever
      # ran the seed ONCE, so a duplicating seed would have shipped green.
      # Import twice and require identical counts.
      - name: Seed smoke — import twice, prove idempotent
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          node scripts/seed.js | tee /tmp/seed-run-1.txt
          node scripts/seed.js | tee /tmp/seed-run-2.txt
          if ! diff -q /tmp/seed-run-1.txt /tmp/seed-run-2.txt >/dev/null; then
            echo "::error::seed is not idempotent — row counts changed on re-run"
            diff /tmp/seed-run-1.txt /tmp/seed-run-2.txt || true
            exit 1
          fi
          echo "seed idempotent across two runs"

  docker:
    runs-on: ubuntu-latest
    needs: build-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Docker build
        run: docker build -t ghrub:ci .

      # M1 shipped a better-sqlite3 SIGSEGV to Render on a fully green CI,
      # because `docker build` proves the image *compiles*, never that it RUNS.
      # The native addon is gone, but the lesson stands: boot the image and
      # drive DB-backed routes, because that is where connecting, migrating and
      # querying actually happen.
      - name: Container smoke test — boot, serve, survive
        run: |
          # --network host so the container reaches the postgres service on the
          # runner's localhost; it also publishes 3000 directly, hence no -p.
          docker run -d --name ghrub-smoke --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            ghrub:ci

          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::container never answered /healthz"
            docker logs ghrub-smoke || true
            docker rm -f ghrub-smoke >/dev/null 2>&1 || true
            exit 1
          fi

          # /healthz is deliberately DB-free (it is Render's health check), so it
          # sails straight past a broken database layer. These routes query Postgres.
          curl -fsS http://localhost:3000/ >/dev/null
          curl -fsS http://localhost:3000/trips >/dev/null
          curl -fsS http://localhost:3000/history >/dev/null

          running=$(docker inspect -f '{{.State.Running}}' ghrub-smoke)
          code=$(docker inspect -f '{{.State.ExitCode}}' ghrub-smoke)
          docker logs ghrub-smoke
          docker rm -f ghrub-smoke >/dev/null 2>&1 || true

          if [ "$running" != "true" ]; then
            echo "::error::container died while serving DB traffic (exit $code; 139 = SIGSEGV)"
            exit 1
          fi
          echo "container smoke test passed — image boots and serves DB-backed routes"
